<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Places — HBnB</title>
  <link rel="icon" type="image/png" href="images/icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo"><img src="images/logo.png" alt="hbnb" /></a>
      <nav>
        <a href="index.html" class="active">Home</a>
        <a href="index.html">Places</a>
      </nav>
      <div class="header-actions">
        <a href="#" class="create-account-link">Create Account</a>
        <a href="login.html" class="login-button" id="header-login-btn">Sign In</a>
      </div>
    </div>
  </header>

  <main>
    <div class="page-hero">
      <h1>Find a place to stay</h1>
      <p>Browse our curated collection of unique homes and experiences.</p>
    </div>

    <div class="filter-bar">
      <label for="price-filter">Filter by price:</label>
      <select id="price-filter">
        <option value="All">All prices</option>
        <option value="100">Up to €100/night</option>
        <option value="250">Up to €250/night</option>
        <option value="500">Up to €500/night</option>
      </select>
      <span id="result-count"></span>
    </div>

    <div class="places-grid" id="places-list">
      <!-- Cards injected by JS -->
      <div class="place-card">
        <div class="skeleton" style="aspect-ratio:16/11;width:100%;"></div>
        <div class="place-card-body">
          <div class="skeleton" style="height:12px;width:30%;"></div>
          <div class="skeleton" style="height:24px;width:68%;"></div>
          <div class="skeleton" style="height:16px;width:100%;"></div>
          <div class="skeleton" style="height:16px;width:85%;"></div>
        </div>
      </div>
      <div class="place-card">
        <div class="skeleton" style="aspect-ratio:16/11;width:100%;"></div>
        <div class="place-card-body">
          <div class="skeleton" style="height:12px;width:34%;"></div>
          <div class="skeleton" style="height:24px;width:74%;"></div>
          <div class="skeleton" style="height:16px;width:100%;"></div>
          <div class="skeleton" style="height:16px;width:78%;"></div>
        </div>
      </div>
      <div class="place-card">
        <div class="skeleton" style="aspect-ratio:16/11;width:100%;"></div>
        <div class="place-card-body">
          <div class="skeleton" style="height:12px;width:26%;"></div>
          <div class="skeleton" style="height:24px;width:60%;"></div>
          <div class="skeleton" style="height:16px;width:100%;"></div>
          <div class="skeleton" style="height:16px;width:82%;"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2024 HBnB — All rights reserved</p>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="scripts.js"></script>
</body>
</html>
