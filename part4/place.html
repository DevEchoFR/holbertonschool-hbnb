<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Place Details — HBnB</title>
  <link rel="icon" type="image/png" href="images/icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo"><img src="images/logo.png" alt="hbnb" /></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="index.html" class="active">Places</a>
      </nav>
      <div class="header-actions">
        <a href="#" class="create-account-link">Create Account</a>
        <a href="login.html" class="login-button" id="header-login-btn">Sign In</a>
      </div>
    </div>
  </header>

  <main>
    <div class="breadcrumb">
      <a href="index.html">← Places</a>
      <span>›</span>
      <span id="breadcrumb-name">Loading…</span>
    </div>

    <section id="place-details">
      <!-- Injected by JS -->
      <div class="place-hero">
        <div class="place-hero-media">
          <div class="skeleton" style="width:100%;height:100%;"></div>
        </div>
        <div class="place-hero-copy">
          <div class="skeleton" style="height:12px;width:24%;margin-bottom:14px;"></div>
          <div class="skeleton" style="height:44px;width:62%;margin-bottom:18px;"></div>
          <div class="skeleton" style="height:16px;width:82%;margin-bottom:12px;"></div>
          <div class="skeleton" style="height:16px;width:70%;margin-bottom:12px;"></div>
          <div class="skeleton" style="height:16px;width:58%;"></div>
        </div>
      </div>
    </section>

    <h2 class="section-title">Reviews</h2>

    <div id="reviews-list">
      <!-- Injected by JS -->
    </div>

    <div id="add-review-cta" style="margin-top:32px; display:none;">
      <a href="#" id="add-review-link" class="btn btn-outline">
        ✍️ Write a review
      </a>
    </div>
  </main>

  <footer>
    <p>© 2024 HBnB — All rights reserved</p>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="scripts.js"></script>
</body>
</html>
