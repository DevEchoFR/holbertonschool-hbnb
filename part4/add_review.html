<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Review - HBNB</title>
    <link rel="stylesheet" href="static/style.css">
    <link rel="icon" href="static/icon.png">
</head>
<body>
    <header>
        <img src="static/logo.png" alt="HBNB Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
        </nav>
        <a href="login.html" class="login-button">Login</a>
    </header>
    <main class="main-content">
        <h1>Add a Review</h1>
        <form class="add-review form" id="review-form" action="#" method="post">
            <label for="user">Your Name:</label>
            <input type="text" id="user" name="user" required>
            <label for="rating">Rating:</label>
            <select id="rating" name="rating" required>
                <option value="">Select rating</option>
                <option value="5">★★★★★</option>
                <option value="4">★★★★☆</option>
                <option value="3">★★★☆☆</option>
                <option value="2">★★☆☆☆</option>
                <option value="1">★☆☆☆☆</option>
            </select>
            <label for="comment">Comment:</label>
            <textarea id="comment" name="comment" rows="4" required></textarea>
            <button type="submit">Submit Review</button>
        </form>
        <div id="review-message" style="margin-top:12px;"></div>
    </main>
    <footer>
        &copy; 2026 HBNB. All rights reserved.
    </footer>
    <script src="static/scripts.js"></script>
</body>
</html>
