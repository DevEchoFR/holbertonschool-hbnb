<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modify Place — HBnB</title>
  <link rel="icon" type="image/png" href="images/icon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="index.html" class="logo"><img src="images/logo.png" alt="hbnb" /></a>
      <nav>
        <a href="index.html">Home</a>
        <a href="index.html#featured-stays">Stays</a>
        <a href="create_place.html">Host</a>
      </nav>
      <div class="header-actions">
        <a href="admin.html" id="admin-link" class="create-account-link" style="display:none;">Admin</a>
        <a href="signup.html" class="create-account-link">Create account</a>
        <a href="login.html" class="login-button" id="header-login-btn">Login</a>
      </div>
    </div>
  </header>

  <main>
    <div class="breadcrumb">
      <a href="admin.html">← Back to admin</a>
      <span>›</span>
      <span>Modify place</span>
    </div>

    <section class="form-card" style="max-width: 760px;">
      <h2>Modify place</h2>
      <p class="subtitle">Update your listing details.</p>

      <form id="place-form" novalidate>
        <div class="form-group">
          <label for="place-name">Place name</label>
          <input type="text" id="place-name" required placeholder="Oceanview Apartment" />
        </div>

        <div class="form-group">
          <label for="place-description">Description <span style="color:var(--text-muted);font-size:0.85em;">(optional)</span></label>
          <textarea id="place-description" placeholder="Tell guests what makes this place special..."></textarea>
        </div>

        <div class="form-group">
          <label for="place-price">Price per night (EUR)</label>
          <input type="number" min="1" id="place-price" required placeholder="120" />
        </div>

        <div class="form-group">
          <label for="place-latitude">Latitude</label>
          <input type="number" step="0.000001" id="place-latitude" required placeholder="41.1579" />
        </div>

        <div class="form-group">
          <label for="place-longitude">Longitude</label>
          <input type="number" step="0.000001" id="place-longitude" required placeholder="-8.6291" />
        </div>

        <div class="form-group">
          <label>Amenities</label>
          <div id="amenities-checklist" class="amenities-checklist">
            <span class="amenities-loading">Loading amenities…</span>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="place-submit-btn">Save changes</button>
        </div>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 HBnB — Holberton School Project</p>
  </footer>

  <div class="toast" id="toast"></div>
  <script src="scripts.js"></script>
</body>
</html>
